name: Build production image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Gemfile
      - Gemfile.lock
      - app/**
      - config/**
      - lib/**
      - bin/**
      - script/**
      - .kamal/**
      - .github/workflows/production_image.yml
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and smoke-test without production credentials
        run: bash script/build_production_image "$GITHUB_SHA" "$RUNNER_TEMP/production-image"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-image-checks-${{ github.sha }}
          path: ${{ runner.temp }}/production-image/checks
          retention-days: 7
      - name: Export verified image
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/release-image"
          docker save post165-public:verified | gzip -1 > "$RUNNER_TEMP/release-image/image.tar.gz"
          cp "$RUNNER_TEMP/production-image/checks/revision.txt" "$RUNNER_TEMP/release-image/revision.txt"
          cd "$RUNNER_TEMP/release-image"
          sha256sum image.tar.gz revision.txt > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/release-image
          retention-days: 3
          compression-level: 0
